name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilation et tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Construction de l'image Docker
        run: docker build -t ebanking-backend .
