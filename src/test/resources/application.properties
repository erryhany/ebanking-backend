# Configuration des tests : base H2 en mémoire, aucun MySQL ni variable d'environnement requis
spring.datasource.url=jdbc:h2:mem:ebank-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Clé factice utilisée uniquement par les tests
jwt.secret=test-only-jwt-secret-not-used-anywhere-else-0123456789abcdefghijklmnop
